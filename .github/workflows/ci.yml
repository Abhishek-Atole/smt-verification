name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run build
      - run: PORT=3000 pnpm --filter infizent-technology-suite run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run test
      - run: PORT=3000 pnpm --filter infizent-technology-suite run test

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter infizent-technology-suite exec tsc --noEmit
      - run: pnpm --filter @workspace/api-server exec tsc --noEmit

  integration:
    name: Integration (real DB) + Endpoint Smoke
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smtverification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smtverification_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/smtverification_test
      JWT_SECRET: ci-integration-jwt-secret-0123456789
      JWT_ADMIN_SECRET: ci-integration-admin-secret-0123456789
      AUDIT_HMAC_SECRET: ci-integration-audit-hmac-secret
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_IP_ALLOWLIST: ""
      SERVE_STATIC: "false"
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/db run push-force
      - run: pnpm --filter @workspace/api-server run seed:users
      - run: pnpm --filter @workspace/api-server run test:integration
      - run: pnpm --filter @workspace/api-server run build
      - name: Start API
        run: |
          node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "API never became healthy"; tail -50 /tmp/api.log; exit 1
      - run: SMOKE_USER=operator1 SMOKE_PASSWORD=operator123 node scripts/smoke-endpoints.mjs
      - if: always()
        run: tail -50 /tmp/api.log
