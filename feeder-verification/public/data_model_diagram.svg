<svg width="100%" viewBox="0 0 680 600" role="img">
<title>SMT Verification Database Entity Relationships</title>
<desc>Entity relationship diagram showing the key tables: boms, bomItems (with self-referencing alternates), sessions, scans, feeders, and auditLogs</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  .t  { font: 400 14px sans-serif; fill: #3d3d3a; }
  .ts { font: 400 12px sans-serif; fill: #73726c; }
  .th { font: 500 14px sans-serif; fill: #3d3d3a; }
  .tf { font: 400 11px sans-serif; fill: #73726c; }
  @media (prefers-color-scheme: dark) {
    .t, .th { fill: #c2c0b6; }
    .ts, .tf { fill: #9c9a92; }
  }
  rect.hdr-blue  { fill: #185FA5; }
  rect.hdr-teal  { fill: #0F6E56; }
  rect.hdr-purp  { fill: #534AB7; }
  rect.hdr-amber { fill: #854F0B; }
  rect.hdr-coral { fill: #993C1D; }
  rect.hdr-gray  { fill: #5F5E5A; }
  text.hdr { font: 500 13px sans-serif; fill: #fff; }
  rect.body { fill: none; stroke: #B4B2A9; stroke-width: 0.5; }
  @media (prefers-color-scheme: dark) { rect.body { stroke: #5F5E5A; } }
  line.field { stroke: #D3D1C7; stroke-width: 0.5; }
  @media (prefers-color-scheme: dark) { line.field { stroke: #444441; } }
  text.pk { font: 600 11px sans-serif; fill: #185FA5; }
  text.fk { font: 400 11px sans-serif; fill: #854F0B; }
  text.fd { font: 400 11px sans-serif; fill: #73726c; }
  @media (prefers-color-scheme: dark) {
    text.pk { fill: #85B7EB; }
    text.fk { fill: #FAC775; }
    text.fd { fill: #9c9a92; }
  }
</style>
</defs>

<!-- ===== boms ===== -->
<rect class="hdr-blue"  x="30"  y="30"  width="130" height="22" rx="4"/>
<text class="hdr" x="95"  y="45" text-anchor="middle">boms</text>
<rect class="body"       x="30"  y="52"  width="130" height="120" rx="0"/>
<text class="pk" x="38" y="68">id</text>
<line class="field" x1="30" y1="74" x2="160" y2="74"/>
<text class="fd" x="38" y="87">name</text>
<line class="field" x1="30" y1="93" x2="160" y2="93"/>
<text class="fd" x="38" y="106">revision</text>
<line class="field" x1="30" y1="112" x2="160" y2="112"/>
<text class="fd" x="38" y="125">companyId</text>
<line class="field" x1="30" y1="131" x2="160" y2="131"/>
<text class="fd" x="38" y="144">status</text>
<line class="field" x1="30" y1="150" x2="160" y2="150"/>
<text class="fd" x="38" y="163">createdAt / updatedAt</text>

<!-- ===== bomItems ===== -->
<rect class="hdr-teal"  x="240" y="30"  width="170" height="22" rx="4"/>
<text class="hdr" x="325" y="45" text-anchor="middle">bomItems</text>
<rect class="body"       x="240" y="52"  width="170" height="290" rx="0"/>
<text class="pk" x="248" y="68">id</text>
<line class="field" x1="240" y1="74" x2="410" y2="74"/>
<text class="fk" x="248" y="87">bomId → boms</text>
<line class="field" x1="240" y1="93" x2="410" y2="93"/>
<text class="fd" x="248" y="106">lineNumber</text>
<line class="field" x1="240" y1="112" x2="410" y2="112"/>
<text class="fd" x="248" y="125">refDes</text>
<line class="field" x1="240" y1="131" x2="410" y2="131"/>
<text class="fd" x="248" y="144">partNumber</text>
<line class="field" x1="240" y1="150" x2="410" y2="150"/>
<text class="fd" x="248" y="163">mpn</text>
<line class="field" x1="240" y1="169" x2="410" y2="169"/>
<text class="fd" x="248" y="182">manufacturer</text>
<line class="field" x1="240" y1="188" x2="410" y2="188"/>
<text class="fd" x="248" y="201">packageSize</text>
<line class="field" x1="240" y1="207" x2="410" y2="207"/>
<text class="fd" x="248" y="220">feederNumber</text>
<line class="field" x1="240" y1="226" x2="410" y2="226"/>
<text class="fd" x="248" y="239">cost / leadTime</text>
<line class="field" x1="240" y1="245" x2="410" y2="245"/>
<text class="fd" x="248" y="258">isAlternate (bool)</text>
<line class="field" x1="240" y1="264" x2="410" y2="264"/>
<text class="fk" x="248" y="277">parentItemId → self</text>
<line class="field" x1="240" y1="283" x2="410" y2="283"/>
<text class="fd" x="248" y="296">status / quantity</text>
<line class="field" x1="240" y1="302" x2="410" y2="302"/>
<text class="fd" x="248" y="320">createdAt / updatedAt</text>

<!-- ===== sessions ===== -->
<rect class="hdr-purp"  x="30"  y="240" width="130" height="22" rx="4"/>
<text class="hdr" x="95" y="255" text-anchor="middle">sessions</text>
<rect class="body"       x="30"  y="262" width="130" height="200" rx="0"/>
<text class="pk" x="38" y="278">id</text>
<line class="field" x1="30" y1="284" x2="160" y2="284"/>
<text class="fk" x="38" y="297">bomId → boms</text>
<line class="field" x1="30" y1="303" x2="160" y2="303"/>
<text class="fd" x="38" y="316">companyName</text>
<line class="field" x1="30" y1="322" x2="160" y2="322"/>
<text class="fd" x="38" y="335">panelId / shiftId</text>
<line class="field" x1="30" y1="341" x2="160" y2="341"/>
<text class="fd" x="38" y="354">operatorId</text>
<line class="field" x1="30" y1="360" x2="160" y2="360"/>
<text class="fd" x="38" y="373">mode (AUTO/MAN/FREE)</text>
<line class="field" x1="30" y1="379" x2="160" y2="379"/>
<text class="fd" x="38" y="392">freeScanMode (bool)</text>
<line class="field" x1="30" y1="398" x2="160" y2="398"/>
<text class="fd" x="38" y="411">status</text>
<line class="field" x1="30" y1="417" x2="160" y2="417"/>
<text class="fd" x="38" y="431">createdAt / updatedAt</text>

<!-- ===== scans ===== -->
<rect class="hdr-amber" x="430" y="140" width="220" height="22" rx="4"/>
<text class="hdr" x="540" y="155" text-anchor="middle">scans</text>
<rect class="body"       x="430" y="162" width="220" height="330" rx="0"/>
<text class="pk" x="438" y="178">id</text>
<line class="field" x1="430" y1="184" x2="650" y2="184"/>
<text class="fk" x="438" y="197">sessionId → sessions</text>
<line class="field" x1="430" y1="203" x2="650" y2="203"/>
<text class="fk" x="438" y="216">feederId → feeders</text>
<line class="field" x1="430" y1="222" x2="650" y2="222"/>
<text class="fd" x="438" y="235">feederNumber</text>
<line class="field" x1="430" y1="241" x2="650" y2="241"/>
<text class="fd" x="438" y="254">scannedValue (raw)</text>
<line class="field" x1="430" y1="260" x2="650" y2="260"/>
<text class="fd" x="438" y="273">scannedMpn</text>
<line class="field" x1="430" y1="279" x2="650" y2="279"/>
<text class="fd" x="438" y="292">expectedPartNumber</text>
<line class="field" x1="430" y1="298" x2="650" y2="298"/>
<text class="fd" x="438" y="311">expectedMpn</text>
<line class="field" x1="430" y1="317" x2="650" y2="317"/>
<text class="fd" x="438" y="330">reelId / lotNumber</text>
<line class="field" x1="430" y1="336" x2="650" y2="336"/>
<text class="fd" x="438" y="349">dateCode</text>
<line class="field" x1="430" y1="355" x2="650" y2="355"/>
<text class="fd" x="438" y="368">status (ok/reject/unknown)</text>
<line class="field" x1="430" y1="374" x2="650" y2="374"/>
<text class="fd" x="438" y="387">validationResult</text>
<line class="field" x1="430" y1="393" x2="650" y2="393"/>
<text class="fd" x="438" y="406">alternateUsed (bool)</text>
<line class="field" x1="430" y1="412" x2="650" y2="412"/>
<text class="fk" x="438" y="425">alternateItemId → bomItems</text>
<line class="field" x1="430" y1="431" x2="650" y2="431"/>
<text class="fd" x="438" y="450">scannedAt</text>

<!-- ===== auditLogs ===== -->
<rect class="hdr-coral" x="30"  y="480" width="130" height="22" rx="4"/>
<text class="hdr" x="95" y="495" text-anchor="middle">auditLogs</text>
<rect class="body"       x="30"  y="502" width="130" height="80" rx="0"/>
<text class="pk" x="38" y="518">id</text>
<line class="field" x1="30" y1="524" x2="160" y2="524"/>
<text class="fd" x="38" y="537">entityType / entityId</text>
<line class="field" x1="30" y1="543" x2="160" y2="543"/>
<text class="fd" x="38" y="556">action / oldValue</text>
<line class="field" x1="30" y1="562" x2="160" y2="562"/>
<text class="fd" x="38" y="575">changedBy / createdAt</text>

<!-- ===== feeders ===== -->
<rect class="hdr-gray"  x="240" y="380" width="130" height="22" rx="4"/>
<text class="hdr" x="305" y="395" text-anchor="middle">feeders</text>
<rect class="body"       x="240" y="402" width="130" height="80" rx="0"/>
<text class="pk" x="248" y="418">id</text>
<line class="field" x1="240" y1="424" x2="370" y2="424"/>
<text class="fk" x="248" y="437">bomId → boms</text>
<line class="field" x1="240" y1="443" x2="370" y2="443"/>
<text class="fd" x="248" y="456">feederNumber</text>
<line class="field" x1="240" y1="462" x2="370" y2="462"/>
<text class="fd" x="248" y="475">status / updatedAt</text>

<!-- ===== Relationship lines ===== -->
<!-- boms → bomItems (1:many) -->
<line x1="160" y1="86" x2="240" y2="86" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
<text class="tf" x="190" y="80" text-anchor="middle" fill="#0F6E56">1:N</text>

<!-- boms → sessions (1:many) -->
<line x1="95" y1="172" x2="95" y2="240" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<text class="tf" x="107" y="212" fill="#534AB7">1:N</text>

<!-- sessions → scans (1:many) -->
<line x1="160" y1="310" x2="430" y2="230" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow)"/>
<text class="tf" x="295" y="262" fill="#854F0B">1:N</text>

<!-- feeders → scans (1:many) -->
<line x1="370" y1="440" x2="430" y2="260" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- bomItems self-ref alternate -->
<path d="M 410 270 Q 440 270 440 250 Q 440 220 410 220" fill="none" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<text class="tf" x="448" y="250" fill="#854F0B">self</text>

<!-- bomItems → scans alternateItemId -->
<line x1="410" y1="155" x2="430" y2="425" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>

<!-- boms → feeders (1:many) -->
<line x1="160" y1="100" x2="240" y2="430" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>

</svg>
