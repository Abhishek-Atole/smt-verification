<svg width="100%" viewBox="0 0 680 860" role="img">
<title>SMT Scan Validation Flow</title>
<desc>Flowchart showing the step-by-step scan validation logic from barcode input to final recorded outcome</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  .t { font: 400 14px sans-serif; fill: #3d3d3a; }
  .ts { font: 400 12px sans-serif; fill: #73726c; }
  .th { font: 500 14px sans-serif; fill: #3d3d3a; }
  @media (prefers-color-scheme: dark) {
    .t, .th { fill: #c2c0b6; }
    .ts { fill: #9c9a92; }
  }
  rect.gray  { fill: #F1EFE8; stroke: #888780; }
  rect.teal  { fill: #E1F5EE; stroke: #0F6E56; }
  rect.amber { fill: #FAEEDA; stroke: #854F0B; }
  rect.blue  { fill: #E6F1FB; stroke: #185FA5; }
  rect.coral { fill: #FAECE7; stroke: #993C1D; }
  rect.purp  { fill: #EEEDFE; stroke: #534AB7; }
  @media (prefers-color-scheme: dark) {
    rect.gray  { fill: #444441; stroke: #B4B2A9; }
    rect.teal  { fill: #085041; stroke: #5DCAA5; }
    rect.amber { fill: #633806; stroke: #EF9F27; }
    rect.blue  { fill: #0C447C; stroke: #85B7EB; }
    rect.coral { fill: #4A1B0C; stroke: #F0997B; }
    rect.purp  { fill: #3C3489; stroke: #AFA9EC; }
    .th { fill: #c2c0b6; }
    .ts { fill: #9c9a92; }
  }
</style>
</defs>

<!-- Step 1: Input -->
<rect class="gray" x="240" y="20" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Operator scans barcode</text>
<text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central">{ sessionId, feederNumber, value }</text>
<line x1="340" y1="64" x2="340" y2="88" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Step 2: Resolve session -->
<rect class="teal" x="220" y="90" width="240" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="107" text-anchor="middle" dominant-baseline="central">Resolve session</text>
<text class="ts" x="340" y="124" text-anchor="middle" dominant-baseline="central">Fetch BOM + feeder map</text>
<line x1="340" y1="134" x2="340" y2="158" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Decision: Free scan? -->
<rect class="amber" x="220" y="160" width="240" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="177" text-anchor="middle" dominant-baseline="central">freeScanMode = true?</text>
<text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central">Session flag</text>

<!-- YES → bypass -->
<line x1="460" y1="182" x2="526" y2="182" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="468" y="174" fill="#0F6E56">YES</text>
<rect class="teal" x="528" y="160" width="118" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="587" y="177" text-anchor="middle" dominant-baseline="central">Record scan</text>
<text class="ts" x="587" y="194" text-anchor="middle" dominant-baseline="central">No validation</text>
<line x1="587" y1="204" x2="587" y2="780" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<line x1="587" y1="780" x2="442" y2="780" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- NO → down -->
<line x1="340" y1="204" x2="340" y2="228" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="220" fill="#633806">NO</text>

<!-- Step 3: Lookup feeder -->
<rect class="teal" x="220" y="230" width="240" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="247" text-anchor="middle" dominant-baseline="central">Lookup feeder # in BOM</text>
<text class="ts" x="340" y="264" text-anchor="middle" dominant-baseline="central">Find expected component</text>
<line x1="340" y1="274" x2="340" y2="298" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Decision: Feeder in BOM? -->
<rect class="amber" x="220" y="300" width="240" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="317" text-anchor="middle" dominant-baseline="central">Feeder found in BOM?</text>
<text class="ts" x="340" y="334" text-anchor="middle" dominant-baseline="central">Match feeder slot</text>

<!-- NO → UNKNOWN left -->
<line x1="220" y1="322" x2="122" y2="322" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="130" y="314" fill="#993C1D">NO</text>
<rect class="coral" x="30" y="300" width="90" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="75" y="317" text-anchor="middle" dominant-baseline="central">UNKNOWN</text>
<text class="ts" x="75" y="334" text-anchor="middle" dominant-baseline="central">feeder_not_found</text>
<line x1="75" y1="344" x2="75" y2="780" stroke="#D85A30" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<line x1="75" y1="780" x2="238" y2="780" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- YES → down -->
<line x1="340" y1="344" x2="340" y2="368" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="360" fill="#633806">YES</text>

<!-- Decision: Match PART# or MPN? -->
<rect class="amber" x="200" y="370" width="280" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="387" text-anchor="middle" dominant-baseline="central">Scan matches PART# or MPN?</text>
<text class="ts" x="340" y="404" text-anchor="middle" dominant-baseline="central">Dual-identifier check</text>

<!-- YES → PASS right -->
<line x1="480" y1="392" x2="554" y2="392" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="488" y="384" fill="#0F6E56">YES</text>
<rect class="teal" x="556" y="370" width="90" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="601" y="387" text-anchor="middle" dominant-baseline="central">PASS</text>
<text class="ts" x="601" y="404" text-anchor="middle" dominant-baseline="central">status: ok</text>
<line x1="601" y1="414" x2="601" y2="780" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<line x1="601" y1="780" x2="442" y2="780" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- NO → down -->
<line x1="340" y1="414" x2="340" y2="438" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="430" fill="#633806">NO</text>

<!-- Decision: Alternate available? -->
<rect class="amber" x="200" y="440" width="280" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="457" text-anchor="middle" dominant-baseline="central">Alternate available for feeder?</text>
<text class="ts" x="340" y="474" text-anchor="middle" dominant-baseline="central">Check isAlternate items</text>

<!-- NO → FAIL left -->
<line x1="200" y1="462" x2="122" y2="462" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="128" y="454" fill="#993C1D">NO</text>
<rect class="coral" x="30" y="440" width="90" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="75" y="457" text-anchor="middle" dominant-baseline="central">FAIL</text>
<text class="ts" x="75" y="474" text-anchor="middle" dominant-baseline="central">status: reject</text>
<line x1="75" y1="484" x2="75" y2="780" stroke="#D85A30" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>

<!-- YES → down -->
<line x1="340" y1="484" x2="340" y2="508" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="500" fill="#633806">YES</text>

<!-- AlternateSelector modal -->
<rect class="purp" x="190" y="510" width="300" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="528" text-anchor="middle" dominant-baseline="central">AlternateSelector modal</text>
<text class="ts" x="340" y="545" text-anchor="middle" dominant-baseline="central">Show primary vs alternate</text>
<text class="ts" x="340" y="559" text-anchor="middle" dominant-baseline="central">+ cost delta + lead time delta</text>
<line x1="340" y1="568" x2="340" y2="592" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Decision: Operator confirms? -->
<rect class="amber" x="210" y="594" width="260" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="611" text-anchor="middle" dominant-baseline="central">Operator confirms?</text>
<text class="ts" x="340" y="628" text-anchor="middle" dominant-baseline="central">Click confirm / reject</text>

<!-- CONFIRM → ALTERNATE right -->
<line x1="470" y1="616" x2="540" y2="616" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="478" y="608" fill="#0F6E56">YES</text>
<rect class="teal" x="542" y="594" width="108" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="596" y="611" text-anchor="middle" dominant-baseline="central">ALTERNATE</text>
<text class="ts" x="596" y="628" text-anchor="middle" dominant-baseline="central">alternateUsed=true</text>
<text class="ts" x="596" y="642" text-anchor="middle" dominant-baseline="central">alternateItemId</text>
<line x1="596" y1="652" x2="596" y2="780" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<line x1="596" y1="780" x2="442" y2="780" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- REJECT → FAIL left -->
<line x1="210" y1="616" x2="122" y2="616" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="128" y="608" fill="#993C1D">NO</text>
<rect class="coral" x="30" y="594" width="90" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="75" y="611" text-anchor="middle" dominant-baseline="central">FAIL</text>
<text class="ts" x="75" y="628" text-anchor="middle" dominant-baseline="central">status: reject</text>
<line x1="75" y1="638" x2="75" y2="780" stroke="#D85A30" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>

<!-- Write record node -->
<rect class="blue" x="238" y="756" width="204" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="774" text-anchor="middle" dominant-baseline="central">Write scan record</text>
<text class="ts" x="340" y="790" text-anchor="middle" dominant-baseline="central">DB insert + auditLog entry</text>
<text class="ts" x="340" y="803" text-anchor="middle" dominant-baseline="central">Emit real-time feedback</text>
<line x1="340" y1="812" x2="340" y2="836" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Update counters -->
<rect class="gray" x="210" y="838" width="260" height="16" rx="6" stroke-width="0.5"/>
<text class="ts" x="340" y="847" text-anchor="middle" dominant-baseline="central">Update SessionStats → ScanHistory → ScanResultDisplay</text>

</svg>
